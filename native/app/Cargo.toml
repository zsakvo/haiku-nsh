[package]
name = "nsh-app-haiku"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
haiku-plugins = { path = "../crates/haiku-plugins" }
nsh-core = "0.4.0"
nsh-base = "0.4.0"
haiku-model.workspace = true
haiku-audio.workspace = true
haiku-store.workspace = true
haiku-library.workspace = true
haiku-lyrics.workspace = true
haiku-palette = { path = "../crates/haiku-palette" }
log.workspace = true
base64.workspace = true
haiku-playback = { path = "../crates/haiku-playback" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
haiku-macos = { path = "../crates/haiku-macos" }

[dev-dependencies]
nsh-engine = { version = "0.4.0", default-features = false, features = ["js"] }
nsh-testing = { version = "0.4.0", default-features = false }
haiku-jsrt = { path = "../crates/haiku-jsrt" }
