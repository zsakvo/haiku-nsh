[package]
name = "nsh-app-haiku"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
haiku-plugins = { path = "../crates/haiku-plugins" }
haiku-audio.workspace = true
haiku-model.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
haiku-macos = { path = "../crates/haiku-macos" }
nsh-platform-macos = "=0.4.0"
