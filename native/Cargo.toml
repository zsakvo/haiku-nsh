[workspace]
members = ["app", "crates/*"]
resolver = "3"

[workspace.dependencies]
# Keep these identical to the versions resolved by nsh-js 0.4.0.
rquickjs = { package = "quickjs-jit", version = "=0.14.1", features = ["futures", "loader"] }
quickjs-jit-stdlib = "=0.14.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
