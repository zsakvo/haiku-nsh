# macOS 27's dyld rejects stripped proc-macro dylibs. Keep build-time
# dependencies unstripped in both the native and NSH-generated workspaces.
[profile.dev.build-override]
strip = false

[profile.release.build-override]
strip = false

# objc2 verifies every Objective-C message's signature against the runtime in
# debug builds (msg_send_check → class_getInstanceMethod). The macOS host sends
# thousands per frame while scrolling, which halved the development frame rate.
[profile.dev.package.objc2]
debug-assertions = false
